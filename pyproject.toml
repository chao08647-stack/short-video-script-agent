[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "script-agent-campus"
version = "0.1.0"
description = "Grounded short-video script agent with LangGraph, skills and human review"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
script-agent = "script_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: explicitly enabled real-model integration checks"]
